        .controls button.stop:hover { background-color: #c0392b; }
        .controls button.sound { background-color: #27ae60; }
        .controls button.sound:hover { background-color: #1e8449; }
        .controls button.sound.off { background-color: #7f8c8d; }

        .scroll-container {
            flex: 1;
            overflow-y: auto;
            background-color: #e0e0e0;
            padding: 1px;
        }

        .table-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
            gap: 1px;
        }

        .cell {
            background-color: #ffffff;
            padding: 6px 3px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            transition: background 0.2s;
        }

        .cell:hover { background-color: #f0f8ff; }
        .cell.speaking { background-color: #fff3cd; }

        .cell-id {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 9px;
            color: #bdc3c7;
        }

        .hanzi-box {
            width: 70px;
            height: 70px;
            margin-top: 5px;
            cursor: pointer;
            border: 1px dashed #eee;
            border-radius: 4px;

        // ----------------------------------------------------------------------
        // ОЗВУЧКА (Web Speech API)
        // ----------------------------------------------------------------------
        let soundEnabled = true;
        let chineseVoice = null;

        // Ищем китайский голос среди доступных
        function pickChineseVoice() {
            const voices = speechSynthesis.getVoices();
            // Ищем zh-CN или zh_CN
            chineseVoice = voices.find(v => v.lang === 'zh-CN' || v.lang === 'zh_CN')
                        || voices.find(v => v.lang && v.lang.toLowerCase().startsWith('zh'))
                        || null;
        }

        // Голоса могут загружаться асинхронно
        if ('speechSynthesis' in window) {
            speechSynthesis.onvoiceschanged = pickChineseVoice;
            pickChineseVoice();
        }

        function speak(text) {
            if (!soundEnabled) return;
            if (!('speechSynthesis' in window)) {
                console.warn('Web Speech API не поддерживается этим браузером');
                return;
            }
            // Отменяем предыдущее воспроизведение, чтобы не было очереди
            speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'zh-CN';
            utter.rate = 0.9;   // чуть медленнее для учебных целей
            utter.pitch = 1;
            if (chineseVoice) utter.voice = chineseVoice;
            speechSynthesis.speak(utter);
        }

        // ----------------------------------------------------------------------
        // ГЕНЕРАЦИЯ ТАБЛИЦЫ
        // ----------------------------------------------------------------------
        const gridContainer = document.getElementById('grid');
        const writers = [];

        function buildTable() {
            const fragment = document.createDocumentFragment();

            characters.forEach((item) => {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.id = item.id;

                // Номер
                const idEl = document.createElement('div');
                idEl.className = 'cell-id';
                idEl.textContent = item.id;
                cell.appendChild(idEl);

                // Блок анимации
                const hanziBox = document.createElement('div');
                hanziBox.className = 'hanzi-box';
                cell.appendChild(hanziBox);

                // Пиньинь
                const pyEl = document.createElement('div');
                pyEl.className = 'pinyin';
                pyEl.textContent = item.pinyin;
                cell.appendChild(pyEl);

                // Перевод
                const transEl = document.createElement('div');
                transEl.className = 'translation';
                transEl.textContent = item.translation;
                cell.appendChild(transEl);

                fragment.appendChild(cell);

                // Hanzi Writer
                const writer = HanziWriter.create(hanziBox, item.char, {
                    width: 70,
                    height: 70,
                    padding: 2,
                    showOutline: true,
                    strokeAnimationSpeed: 1.5,
                    strokeColor: '#2c3e50',
                    outlineColor: '#e0e0e0',
                    radicalColor: '#e74c3c',
                    delayBetweenStrokes: 150
                });
                writers.push(writer);

                // Клик: анимация + звук
                hanziBox.addEventListener('click', () => {
                    writer.animateCharacter();
                    speak(item.char);

                    // Подсветка ячейки на время озвучки
                    cell.classList.add('speaking');
                    setTimeout(() => cell.classList.remove('speaking'), 900);
                });
            });

            gridContainer.appendChild(fragment);
        }

        // ----------------------------------------------------------------------
        // УПРАВЛЕНИЕ
        // ----------------------------------------------------------------------
        document.getElementById('play-all').addEventListener('click', () => {
            writers.forEach((writer, index) => {
                setTimeout(() => {
                    writer.animateCharacter();
                }, index * 250);
            });
        });

        document.getElementById('stop-all').addEventListener('click', () => {
            speechSynthesis.cancel();
            writers.forEach(writer => {
                writer.cancelQuiz();
                writer.animateCharacter({ strokeAnimationSpeed: 0 });
            });
            document.querySelectorAll('.cell.speaking').forEach(c => c.classList.remove('speaking'));
        });

        // Переключатель звука
        const soundBtn = document.getElementById('toggle-sound');
        soundBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            if (soundEnabled) {
                soundBtn.textContent = '🔊 Звук: ВКЛ';
                soundBtn.classList.remove('off');
            } else {
                soundBtn.textContent = '🔇 Звук: ВЫКЛ';
                soundBtn.classList.add('off');
                speechSynthesis.cancel();
            }
        });

        // Запуск
        buildTable();
    </script>
